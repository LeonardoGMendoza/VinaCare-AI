<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VinaCare</title>
<meta name="theme-color" content="#1c2321">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@600;700&display=swap">
<style>:root{--stage-top:#2b3532;--stage-bottom:#141a18;--ink:#f3f6f4;--muted:#b9c4bf;--accent:#5cbfa8;--accent-ink:#0d1714;--warm:#e39a72;--chip:#ffffff24;--chip-line:#ffffff38;--body:"Nunito Sans","Segoe UI",Roboto,Arial,sans-serif}:root[data-theme=light]{--stage-top:#efe9e2;--stage-bottom:#d9d0c6;--ink:#1f2826;--muted:#4f5b57;--accent:#2f7d6d;--accent-ink:#fff;--chip:#ffffffb3;--chip-line:#0000001f}*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}body{background:linear-gradient(180deg,var(--stage-top),var(--stage-bottom));color:var(--ink);font-family:var(--body);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}.stage{height:100vh;cursor:pointer;height:100dvh;position:fixed;top:0;bottom:0;left:0;right:0}#avatar{position:absolute;top:0;bottom:0;left:0;right:0}.topo{top:max(14px,env(safe-area-inset-top));left:max(14px,env(safe-area-inset-left));right:max(14px,env(safe-area-inset-right));pointer-events:none;justify-content:space-between;gap:8px;display:flex;position:absolute}.topo .grupo{pointer-events:auto;gap:8px;display:flex}.chip{font:inherit;color:var(--ink);background:var(--chip);border:1px solid var(--chip-line);-webkit-backdrop-filter:blur(8px);cursor:pointer;border-radius:999px;justify-content:center;align-items:center;gap:6px;min-width:44px;min-height:44px;padding:0 14px;font-size:15px;font-weight:700;text-decoration:none;display:inline-flex}.chip svg{width:20px;height:20px}.baixo{left:0;right:0;bottom:max(22px,env(safe-area-inset-bottom));pointer-events:none;flex-direction:column;align-items:center;gap:10px;display:flex;position:absolute}.mic{pointer-events:auto;background:var(--accent);width:88px;height:88px;color:var(--accent-ink);cursor:pointer;border:0;border-radius:50%;justify-content:center;align-items:center;display:flex;box-shadow:0 8px 24px #00000059}.mic svg{width:40px;height:40px}.mic[data-estado=ouvindo]{background:var(--warm);animation:1.2s ease-in-out infinite pulsa}.mic[data-estado=pensando]{opacity:.75}@keyframes pulsa{0%,to{box-shadow:0 0 #e39a7299}50%{box-shadow:0 0 0 18px #e39a7200}}.dica{color:var(--muted);text-shadow:0 1px 3px #00000059;text-align:center;min-height:1.4em;padding:0 16px;font-size:15px;font-weight:600}.status{background:var(--chip);border:1px solid var(--chip-line);-webkit-backdrop-filter:blur(8px);text-align:center;border-radius:14px;max-width:min(86vw,420px);padding:12px 18px;font-size:16px;font-weight:600;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}.status[hidden]{display:none}button:focus-visible{outline:3px solid var(--warm);outline-offset:2px}a:focus-visible{outline:3px solid var(--warm);outline-offset:2px}@media (prefers-reduced-motion:reduce){.mic[data-estado=ouvindo]{animation:none}}</style>
  <script type="module" crossorigin src="./assets/main-xvDGS2dN.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/modulepreload-polyfill-P2Xu9kJm.js">
</head>
<body>
<main class="stage" id="palco" aria-label="Toque para falar">
  <div id="avatar" aria-hidden="true"></div>

  <div class="topo">
    <div class="grupo">
      <button type="button" class="chip" id="trocaAvatar" aria-label="Trocar avatar">Clara</button>
    </div>
    <div class="grupo">
      <button type="button" class="chip" id="trocaIdioma" aria-label="Idioma">PT</button>
      <a class="chip" id="linkExercicio" href="./exercicio.html" aria-label="Exercícios">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="13" cy="4" r="2"/><path d="M7 21l3-6 3 2v4"/><path d="M5 12l3-3 4 1 3 3 3 1"/><path d="M10 15l1-5"/></svg>
      </a>
    </div>
  </div>

  <div class="status" id="status">Carregando…</div>

  <div class="baixo">
    <button type="button" class="mic" id="mic" data-estado="pronto" aria-label="Falar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><path d="M12 17v4"/></svg>
    </button>
    <div class="dica" id="dica" aria-live="polite"></div>
  </div>
</main>

<script>
// Diagnóstico: mostra na tela qualquer erro (útil no celular, onde não há console)
(function(){
  var st = document.getElementById('status');
  function show(m){ if (st){ st.hidden = false; st.textContent = 'Erro: ' + m; } }
  window.__vinaErro = show;
  if (st) st.textContent = 'Carregando o motor 3D…';
  window.addEventListener('error', function(e){
    if (e && e.message) show(e.message + ' (' + String(e.filename || '').split('/').pop() + ':' + (e.lineno || '') + ')');
  });
  window.addEventListener('unhandledrejection', function(e){
    var r = e && e.reason; show(String((r && r.message) || r));
  });
  setTimeout(function(){
    if (!window.__vinaStarted){
      var ios = (navigator.userAgent.match(/OS (\d+)_(\d+)/) || []);
      show('o motor 3D não iniciou' + (ios[1] ? ' (iOS ' + ios[1] + '.' + ios[2] + ')' : '') + '. Recarregue a página; se continuar, me mande este print.');
    }
  }, 25000);
})();
</script>
</body>
</html>
