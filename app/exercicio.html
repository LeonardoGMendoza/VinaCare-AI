<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VinaCare Exercícios</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Nunito+Sans:wght@400;600;700&display=swap">
<style>
body{margin:0}
/* Layout: palco do avatar em destaque, painel de conversa ao lado (empilha no celular) */
:root{
  --bg:#f6f3ef; --surface:#ffffff; --ink:#26302d; --muted:#5f6b67;
  --accent:#2f7d6d; --accent-ink:#ffffff; --warm:#c9774b; --line:#e2ddd6; --stage:#e9e4dd;
  --display:"Fraunces", Georgia, "Times New Roman", serif;
  --body:"Nunito Sans", "Segoe UI", Roboto, Arial, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141917; --surface:#1d2421; --ink:#eef2ef; --muted:#a8b3ae;
  --accent:#5cbfa8; --accent-ink:#0d1714; --warm:#e39a72; --line:#2c3531; --stage:#232b28; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141917; --surface:#1d2421; --ink:#eef2ef; --muted:#a8b3ae;
  --accent:#5cbfa8; --accent-ink:#0d1714; --warm:#e39a72; --line:#2c3531; --stage:#232b28; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px}
h1{font-family:var(--display);font-weight:600;font-size:clamp(28px,4vw,38px);margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 span{color:var(--accent)}
.tag{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px}
@media (max-width:760px){.grid{grid-template-columns:1fr}}
.stage{position:relative;background:var(--stage);border-radius:18px;overflow:hidden;aspect-ratio:3/4;max-height:72vh;width:100%;max-width:100%}
#avatar{position:absolute;inset:0}
.status{position:absolute;left:14px;right:14px;bottom:14px;background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 14px;font-size:15px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.status[hidden]{display:none}
.sub{position:absolute;left:14px;right:14px;top:14px;font-family:var(--display);font-size:20px;line-height:1.35;color:var(--ink);text-shadow:0 1px 0 var(--stage)}
.panel{display:flex;flex-direction:column;gap:16px;min-width:0}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.box h2{font-family:var(--display);font-weight:500;font-size:20px;margin:0}
.row{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;cursor:pointer;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 16px;min-height:44px}
button:hover{border-color:var(--accent)}
button:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--warm);outline-offset:2px}
button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.phr{text-align:left;border-radius:12px;font-size:16px}
textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:84px;resize:vertical;width:100%;box-sizing:border-box}
select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px}
.note{font-size:14px;color:var(--muted);margin:0}
label{font-size:14px;color:var(--muted)}
.log{display:flex;flex-direction:column;gap:8px;max-height:220px;overflow-y:auto}
.log:empty::before{content:"A conversa aparece aqui.";color:var(--muted);font-size:15px}
.msg{padding:8px 12px;border-radius:12px;max-width:88%;font-size:16px;line-height:1.4}
.msg.ela{background:var(--stage);align-self:flex-start}
.msg.alerta{background:var(--warm);color:#fff;align-self:stretch;max-width:100%;font-size:15px}
.msg.voce{background:var(--accent);color:var(--accent-ink);align-self:flex-end}
.mic[aria-pressed="true"]{background:var(--warm);border-color:var(--warm);color:#fff}
#nome,#reply{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:10px 16px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>
.cam{position:relative;background:var(--stage);border-radius:18px;overflow:hidden;aspect-ratio:4/3;width:100%;max-width:100%}
.cam video,.cam canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.grande{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:96px;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.6);pointer-events:none}
.medidor{font-variant-numeric:tabular-nums;font-size:15px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
input[type=text],input[type=password],select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.campo{display:flex;flex-direction:column;gap:4px;flex:1;min-width:140px}
button:disabled{opacity:.4;cursor:not-allowed}
.instr{font-size:15px;color:var(--muted);margin:0}
</style>
<style>
.placar{display:flex;align-items:baseline;gap:12px}
.placar b{font-family:var(--display);font-size:72px;line-height:1;color:var(--accent)}
.placar span{font-size:18px;color:var(--muted)}
.resultado{font-size:20px;line-height:1.4;margin:0}
.resultado.certo{color:var(--accent)}
.resultado.errado{color:var(--warm)}
.grande-btn{font-size:20px;padding:14px 22px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Vina<span>Care</span> · exercícios</h1>
    <span class="tag">Avaliado pelo modelo do OCI Data Science</span>
  </header>
  <div class="grid">
    <div style="display:flex;flex-direction:column;gap:10px;min-width:0">
      <div class="cam">
        <video id="video" playsinline muted></video>
        <canvas id="tela"></canvas>
        <div class="grande" id="contagem"></div>
      </div>
      <div class="status" id="status" style="position:static">Toque em "Começar" e fique de corpo inteiro na câmera, a uns 2 metros.</div>
    </div>
    <div class="panel">
      <div class="box">
        <h2>Exercício</h2>
        <select id="exercicio" aria-label="Exercício"></select>
        <p class="instr" id="instr"></p>
      </div>
      <div class="box">
        <h2>Repetições</h2>
        <div class="placar"><b id="reps">0</b><span id="fase">pronto</span></div>
      </div>
      <div class="box">
        <div class="row">
          <button type="button" class="primary grande-btn" id="comecar">Começar</button>
        </div>
        <p class="resultado" id="resultado" aria-live="polite"></p>
        <p class="note">A imagem não sai do aparelho: só os pontos do corpo vão para a avaliação. <a href="./index.html">Voltar para a conversa</a></p>
      </div>
    </div>
  </div>
</div>
<script type="module" src="./src/exercicio.js"></script>
</body>
</html>
