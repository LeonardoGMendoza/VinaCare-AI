<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VinaCare</title>
<meta name="theme-color" content="#1c2321">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@600;700&display=swap">
<style>
/* Tela única: só o avatar. A pessoa toca em qualquer lugar (ou no botão) e fala. */
:root{
  --stage-top:#2b3532; --stage-bottom:#141a18; --ink:#f3f6f4; --muted:#b9c4bf;
  --accent:#5cbfa8; --accent-ink:#0d1714; --warm:#e39a72; --chip:rgba(255,255,255,.14); --chip-line:rgba(255,255,255,.22);
  --body:"Nunito Sans","Segoe UI",Roboto,Arial,sans-serif;
}
:root[data-theme="light"]{ --stage-top:#efe9e2; --stage-bottom:#d9d0c6; --ink:#1f2826; --muted:#4f5b57;
  --accent:#2f7d6d; --accent-ink:#ffffff; --chip:rgba(255,255,255,.7); --chip-line:rgba(0,0,0,.12); }
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:linear-gradient(180deg,var(--stage-top),var(--stage-bottom));color:var(--ink);font-family:var(--body);
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
.stage{position:fixed;inset:0;height:100vh;height:100dvh;cursor:pointer}
#avatar{position:absolute;inset:0}
.poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;transition:opacity .6s ease;pointer-events:none}
.poster.sumir{opacity:0}
.poster[hidden]{display:none}
/* Cantos: botões pequenos */
.topo{position:absolute;top:max(14px,env(safe-area-inset-top));left:max(14px,env(safe-area-inset-left));right:max(14px,env(safe-area-inset-right));
  display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.topo .grupo{display:flex;gap:8px;pointer-events:auto}
.chip{font:inherit;font-weight:700;font-size:15px;color:var(--ink);background:var(--chip);border:1px solid var(--chip-line);border-radius:999px;
  min-height:44px;min-width:44px;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);cursor:pointer}
.chip svg{width:20px;height:20px}
.chip[hidden]{display:none}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
/* Microfone grande embaixo */
.baixo{position:absolute;left:0;right:0;bottom:max(22px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none}
.mic{pointer-events:auto;width:88px;height:88px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);
  display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(0,0,0,.35);cursor:pointer}
.mic svg{width:40px;height:40px}
.mic[data-estado="ouvindo"]{background:var(--warm);animation:pulsa 1.2s ease-in-out infinite}
.mic[data-estado="pensando"]{opacity:.75}
@keyframes pulsa{0%,100%{box-shadow:0 0 0 0 rgba(227,154,114,.6)}50%{box-shadow:0 0 0 18px rgba(227,154,114,0)}}
.dica{font-size:15px;font-weight:600;color:var(--muted);text-shadow:0 1px 3px rgba(0,0,0,.35);min-height:1.4em;text-align:center;padding:0 16px}
.status{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--chip);border:1px solid var(--chip-line);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:14px;padding:12px 18px;font-size:16px;font-weight:600;max-width:min(86vw,420px);text-align:center}
.status[hidden]{display:none}
.login{position:absolute;inset:0;z-index:10;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;cursor:default;-webkit-user-select:text;user-select:text}
.login[hidden]{display:none}
.cartao{width:min(100%,380px);background:var(--stage-top);border:1px solid var(--chip-line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:8px;box-shadow:0 12px 40px rgba(0,0,0,.4)}
.cartao h2{margin:0 0 6px;font-size:20px}
.cartao label{font-size:14px;color:var(--muted)}
.cartao input{font:inherit;font-size:17px;color:var(--ink);background:rgba(0,0,0,.25);border:1px solid var(--chip-line);border-radius:12px;padding:12px;min-height:48px}
.cartao .msg{min-height:1.4em;margin:4px 0 0;font-size:15px;color:var(--warm)}
.cartao .acoes{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.chip.primario{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--warm);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.mic[data-estado="ouvindo"]{animation:none}}
</style>
</head>
<body>
<main class="stage" id="palco" aria-label="Toque para falar">
  <div id="avatar" aria-hidden="true"></div>
  <img id="poster" class="poster" alt="" aria-hidden="true" hidden>

  <div class="topo">
    <div class="grupo">
      <button type="button" class="chip" id="trocaAvatar" aria-label="Trocar avatar">Clara</button>
      <button type="button" class="chip" id="modoAula" aria-pressed="false" aria-label="Aula de inglês">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 9L12 4 2 9l10 5 10-5z"/><path d="M6 11v5c3 2 9 2 12 0v-5"/></svg>EN
      </button>
    </div>
    <div class="grupo">
      <button type="button" class="chip" id="trocaIdioma" aria-label="Idioma">PT</button>
      <a class="chip" id="linkExercicio" href="./exercicio.html" aria-label="Exercícios">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="13" cy="4" r="2"/><path d="M7 21l3-6 3 2v4"/><path d="M5 12l3-3 4 1 3 3 3 1"/><path d="M10 15l1-5"/></svg>
      </a>
    </div>
  </div>

  <div class="login" id="login" role="dialog" aria-modal="true" aria-labelledby="loginTitulo" hidden>
    <form class="cartao" id="loginForm">
      <h2 id="loginTitulo">Aula de inglês (premium)</h2>
      <label for="loginEmail" id="loginEmailRot">E-mail</label>
      <input id="loginEmail" type="email" autocomplete="username" autocapitalize="off" required>
      <label for="loginSenha" id="loginSenhaRot">Senha</label>
      <input id="loginSenha" type="password" autocomplete="current-password" required>
      <p class="msg" id="loginMsg" aria-live="polite"></p>
      <div class="acoes">
        <button type="button" class="chip" id="loginCancelar">Cancelar</button>
        <button type="submit" class="chip primario" id="loginEntrar">Entrar</button>
      </div>
    </form>
  </div>

  <div class="status" id="status" hidden></div>

  <div class="baixo">
    <button type="button" class="mic" id="mic" data-estado="pronto" aria-label="Falar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><path d="M12 17v4"/></svg>
    </button>
    <div class="dica" id="dica" aria-live="polite"></div>
  </div>
</main>

<script>
// Diagnóstico: mostra na tela qualquer erro (útil no celular, onde não há console)
(function(){
  var st = document.getElementById('status');
  function show(m){ if (st){ st.hidden = false; st.textContent = 'Erro: ' + m; } }
  window.__vinaErro = show;
  if (st) st.textContent = 'Carregando o motor 3D…';
  window.addEventListener('error', function(e){
    if (e && e.message) show(e.message + ' (' + String(e.filename || '').split('/').pop() + ':' + (e.lineno || '') + ')');
  });
  window.addEventListener('unhandledrejection', function(e){
    var r = e && e.reason; show(String((r && r.message) || r));
  });
  setTimeout(function(){
    if (!window.__vinaStarted){
      var ios = (navigator.userAgent.match(/OS (\d+)_(\d+)/) || []);
      show('o motor 3D não iniciou' + (ios[1] ? ' (iOS ' + ios[1] + '.' + ios[2] + ')' : '') + '. Recarregue a página; se continuar, me mande este print.');
    }
  }, 25000);
})();
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
